[package]
name = "tinyklv"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "The fastest derive-macro Key-Length-Value (KLV) framework in Rust"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
include = ["/src", "/CHANGELOG.md", "/LICENSE", "/README.md"]
publish = true

[package.metadata.docs.rs]
# `full`, not every feature: `bench`'s native-type impls are provisional, not public API
features = ["full"]
targets = ["x86_64-unknown-linux-gnu"]

[workspace]
members = ["impl"]

[workspace.package]
version = "0.2.0-rc.1"
authors = ["Arpad Voros <arpadav@gmail.com>"]
license = "MIT"
repository = "https://github.com/arpadav/tinyklv"
homepage = "https://arpadvoros.com/tinyklv"
documentation = "https://docs.rs/tinyklv"
keywords = ["decode", "encode", "klv", "parsing", "tlv"]
categories = ["development-tools", "encoding", "parsing"]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# the helper crates, each pinned to `[workspace.package]`'s version
tinyklv-impl = { path = "impl", version = "=0.2.0-rc.1" }
tk-syn-macros = { path = "impl/tk-syn-macros", version = "=0.2.0-rc.1" }

