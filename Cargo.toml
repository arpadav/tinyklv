[dependencies]
# --------------------------------------------------
# external
# --------------------------------------------------
chrono = { version = "0.4.45", optional = true }
memchr = "2.8.0"
num-traits = "0.2.19"
pastey = "0.2.3"
tracing = { version = "0.1.44", optional = true }
winnow = { version = "1.0.2", features = ["binary", "parser"] }
# --------------------------------------------------
# workspace
# --------------------------------------------------
tinyklv-impl = { path = "impl", version = "=0.2.0-rc.1" }

[dev-dependencies]
criterion = "^0.8"
micropb = { version = "^0.6", features = ["alloc"] }
proptest = "1.11"
# prost runtime must stay in lockstep with prost-build in benches/proto-gen (separate workspace)
prost = "^0.14"
# prost-types: WKT Timestamp/Duration for the native_nested record (lockstep with prost)
prost-types = "^0.14"
protobuf = "^3"
quick-protobuf = "^0.8"
rand = "^0.10"
rand_distr = "^0.6"
serde = { version = "^1", features = ["derive"] }
serde_bytes = "^0.11"
serde_klv = "^0.3"
tlv_parser = "^0.10"
tokio = { version = "^1.52", features = ["macros", "rt-multi-thread", "sync"] }
trybuild = "1.0.121"

[[bench]]
# the suite uses the native-type codecs behind `bench`; without the feature it is skipped
name = "compsuite"
harness = false
required-features = ["bench"]

[[bench]]
# guards the Decoder::feed compaction against per-feed O(n^2) on small-chunk streaming
name = "streaming_compaction"
harness = false

[[bench]]
# the fixed-width int decoders (safe `try_from` vs unchecked `unsafe`), the BER decoders, and an
# exact-sized slice decode
name = "int_decode"
harness = false

[[bench]]
# a varint with a length prefix vs `size(implicit)`, and what opting in to `unknown(..)` costs
name = "framing_modes"
harness = false

[features]
default = []
ascii = ["winnow/ascii"]
bench = ["chrono"] # for benchmarking
full = ["ascii", "chrono"]
tracing = ["dep:tracing", "tinyklv-impl/tracing"]
simd = ["winnow/simd"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
indexing_slicing = "deny"             # force explicit bounds-reasoning on every raw slice index
cast_possible_truncation = "allow"    # wire-format width casts
cast_possible_wrap = "allow"          # wire-format width casts
cast_sign_loss = "allow"              # wire-format width casts
cast_lossless = "allow"               # wire-format width casts
inline_always = "allow"               # hot-path inlining convention
float_cmp = "allow"                   # exact-roundtrip float eq in tests
must_use_candidate = "allow"          # must_use applied deliberately
too_many_lines = "allow"              # codegen/decode fns
needless_for_each = "allow"           # for_each idiomatic in tests
missing_panics_doc = "allow"          # decoders all return Result
similar_names = "allow"               # short domain names (lat/lon)
cast_precision_loss = "allow"         # scale/precision casts in codecs
unreadable_literal = "allow"          # numeric test fixtures
iter_not_returning_iterator = "allow" # bounded Decoder iterator surface
into_iter_without_iter = "allow"      # bounded Decoder iterator surface
manual_let_else = "allow"             # test/example exemption
struct_field_names = "allow"          # test/example exemption
many_single_char_names = "allow"      # single-char loop vars in tests
trivially_copy_pass_by_ref = "allow"  # small-Copy-by-ref in tests
doc_markdown = "allow"                # doc-backtick nits in tests

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
