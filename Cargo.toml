[package]
name = "tinyklv"
version = "0.2.0-rc.1"
authors = ["Arpad Voros <arpadav@gmail.com>"]
license = "MIT"
description = "The fastest derive-macro Key-Length-Value (KLV) framework in Rust"
repository = "https://github.com/arpadav/tinyklv"
homepage = "https://arpadvoros.com/tinyklv"
documentation = "https://docs.rs/tinyklv"
readme = "README.md"
keywords = ["decode", "encode", "klv", "parsing", "tlv"]
categories = ["development-tools", "encoding", "parsing"]
edition = "2024"
rust-version = "1.95"
include = ["/src", "/CHANGELOG.md", "/LICENSE", "/README.md"]
publish = true

[package.metadata.docs.rs]
# `full`, not every feature: `bench`'s native-type impls are provisional, not public API
features = ["full"]
targets = ["x86_64-unknown-linux-gnu"]

[workspace]
members = ["impl"]

