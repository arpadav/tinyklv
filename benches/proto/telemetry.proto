// Protobuf schema for the flat benchmark record `Telemetry`.
//
// One message mirroring `benches/suite/records.rs::Telemetry`. Field numbers match the KLV
// keys (0x01..0x08) one-for-one. Protobuf has no u8/u16/i16 types, so the narrow KLV widths
// map to the smallest protobuf scalar that holds them - uint32 for unsigned, sint32
// (zig-zag varint) for the signed 16/32-bit fields. The codec wrappers in the four
// protobuf approaches narrow back to the real KLV widths on decode.
//
// Author: aav
syntax = "proto3";

package bench;

// Flat telemetry record: eight primitive fields, one per KLV key.
message Telemetry {
  uint32 a = 1; // KLV u8
  uint32 b = 2; // KLV u16
  uint32 c = 3; // KLV u32
  uint64 d = 4; // KLV u64
  sint32 e = 5; // KLV i16
  sint32 f = 6; // KLV i32
  float  g = 7; // KLV f32
  double h = 8; // KLV f64
}
