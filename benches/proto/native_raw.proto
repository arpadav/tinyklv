// Raw-scalar protobuf schema for the native-types benchmark record `NativeNested`.
//
// Fed to the micropb and quick_protobuf backends, which have no std/chrono conversions, so the
// temporal fields are raw integers and the wrappers convert manually - the honest representation
// for those crates. Mirrors `benches/suite/records.rs::NativeNested`; field numbers match the KLV
// keys (0x01..0x0C). Self-contained (its own `GpsCoord`, own `bench_native` package) so the
// per-file codegen backends need no cross-file import.
//
// Author: aav
syntax = "proto3";

package bench_native;

// Nested coordinate sub-packet (own copy; distinct from the `bench` package's GpsCoord).
message GpsCoord {
  double lat = 1;
  double lon = 2;
}

// Native-types record with raw temporal scalars (micropb / quick_protobuf).
message NativeNested {
  uint32   id = 1;               // KLV u32
  GpsCoord coord = 2;            // nested sub-packet
  int64    timestamp_nanos = 3;  // -> chrono::DateTime<Utc>
  uint64   elapsed_nanos = 4;    // -> std::time::Duration
  uint32   addr = 5;             // -> std::net::Ipv4Addr
  bytes    addr6 = 6;            // -> std::net::Ipv6Addr (16 bytes)
  int32    date_days = 7;        // -> chrono::NaiveDate
  uint32   time_secs = 8;        // -> chrono::NaiveTime
  uint32   symbol = 9;           // -> char
  uint32   seq = 10;             // -> core::num::NonZeroU32
  bool     flag = 11;            // -> bool
  string   label = 12;           // -> String
}
