// Well-known-type protobuf schema for the native-types benchmark record `NativeNested`.
//
// Fed to the prost and rust_protobuf backends, which DO provide native conversions for the
// google.protobuf well-known types: `Duration` <-> `std::time::Duration` (exact) and `Timestamp`
// <-> `std::time::SystemTime` (then chrono's `DateTime<Utc>: From<SystemTime>` finishes the
// bridge). Using the WKTs here lets those backends convert via crate-provided code instead of
// hand-rolled nanos arithmetic - the honest representation of their real capability. All other
// fields are raw (no crate supports Ipv4/Ipv6/NaiveDate/NaiveTime/char/NonZeroU32).
//
// Mirrors `benches/suite/records.rs::NativeNested`; field numbers match the KLV keys (0x01..0x0C).
// Self-contained `GpsCoord` + own `bench_native` package, as in `native_raw.proto`.
//
// Author: aav
syntax = "proto3";

package bench_native;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Nested coordinate sub-packet (own copy; distinct from the `bench` package's GpsCoord).
message GpsCoord {
  double lat = 1;
  double lon = 2;
}

// Native-types record with well-known-type temporal fields (prost / rust_protobuf).
message NativeNested {
  uint32                    id = 1;         // KLV u32
  GpsCoord                  coord = 2;      // nested sub-packet
  google.protobuf.Timestamp timestamp = 3; // -> chrono::DateTime<Utc> (via SystemTime)
  google.protobuf.Duration  elapsed = 4;   // -> std::time::Duration (exact)
  uint32                    addr = 5;       // -> std::net::Ipv4Addr
  bytes                     addr6 = 6;      // -> std::net::Ipv6Addr (16 bytes)
  int32                     date_days = 7;  // -> chrono::NaiveDate
  uint32                    time_secs = 8;  // -> chrono::NaiveTime
  uint32                    symbol = 9;     // -> char
  uint32                    seq = 10;       // -> core::num::NonZeroU32
  bool                      flag = 11;      // -> bool
  string                    label = 12;     // -> String
}
