[package]
name = "tinyklv-impl"
version = "0.2.0-rc.1"
authors = ["Arpad Voros <arpadav@gmail.com>"]
license = "MIT"
description = "Implementation detail of the `tinyklv` crate"
repository = "https://github.com/arpadav/tinyklv"
homepage = "https://arpadvoros.com/tinyklv"
documentation = "https://docs.rs/tinyklv"
readme = "README.md"
keywords = ["decode", "encode", "klv", "parsing", "tlv"]
categories = ["development-tools", "encoding", "parsing"]
edition = "2024"
rust-version = "1.95"
publish = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
proc-macro = true

[dependencies]
# --------------------------------------------------
# external
# --------------------------------------------------
pastey = "0.2.3"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }
thiserror = "2.0"
# --------------------------------------------------
# workspace
# --------------------------------------------------
tk-syn-macros = { path = "tk-syn-macros", version = "=0.2.0-rc.1" }

[features]
tracing = []

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
wildcard_imports = "allow"        # prelude glob is the import surface
too_many_lines = "allow"          # codegen fns
needless_pass_by_value = "allow"  # proc-macro helpers consume owned AST
default_trait_access = "allow"    # Default::default() clear in token code
used_underscore_binding = "allow" # _-prefixed fields mark retained AST
similar_names = "allow"           # short domain names (lat/lon)
