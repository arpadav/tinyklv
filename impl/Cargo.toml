[package]
name = "tinyklv-impl"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Implementation detail of the `tinyklv` crate"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
include = ["/src", "/LICENSE", "/README.md"]
publish = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
proc-macro = true

[dependencies]
# --------------------------------------------------
# external
# --------------------------------------------------
pastey = "0.2.3" # the `paste!` that tk-syn-macros' `create_parser!` expands to here
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }
thiserror = "2.0"
# --------------------------------------------------
# workspace
# --------------------------------------------------
tk-syn-macros.workspace = true

[features]
tracing = []

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
wildcard_imports = "allow"        # the attribute parsers glob the symbol and type tables
too_many_lines = "allow"          # codegen fns
needless_pass_by_value = "allow"  # quote! helpers take the TokenStreams they splice
default_trait_access = "allow"    # Default::default() clear in token code
used_underscore_binding = "allow" # _-prefixed fields mark retained AST
similar_names = "allow"           # decoder / decoded pairs in codegen
